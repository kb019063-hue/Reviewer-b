name: Build AnneControl Huawei P20 Lite APK

on:
  push:
    branches:
      - "arena/**"
      - "main"
  workflow_dispatch:

# Two pushes in a row used to race on the same `latest-apk` release tag: the second
# job could fail with 422 "already_exists" or overwrite the asset while someone was
# downloading it.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Sign AnneControl APK (Android 9 / ANE-LX1)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android 9 (API 28) Platform SDK if needed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-28/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" || true
          fi

      - name: Set up Node (for the UI regression tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: UI regression tests (jsdom, no device needed)
        working-directory: test/ui
        run: |
          npm install --no-fund --no-audit
          node ui_test.js

      - name: Unit tests, then compile, align & sign AnneControl-P20Lite.apk
        env:
          # Base64 of keystore/annecontrol-release.jks. Without it every build gets a
          # fresh throwaway key and installed users can no longer update in place.
          # One secret, one paste: "<base64 keystore>|<password>"
          ANNE_SIGNING_KEY: ${{ secrets.ANNE_SIGNING_KEY }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # ci_build.py runs the JVM unit tests (QueuePlanner) first and aborts if they fail.
        run: python3 anne-control-apk/ci_build.py

      - name: Upload AnneControl APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnneControl-P20Lite-APK
          path: dist/AnneControl-P20Lite.apk
          if-no-files-found: error
          retention-days: 30

      # Only main publishes a public release: a feature-branch push must never move
      # the `latest-apk` tag that users are downloading from.
      - name: Publish Direct-Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "AnneControl P20 Lite (Latest APK Direct Download)"
          body: |
            ### 📱 AnneControl for Huawei P20 Lite (ANE-LX1 / EMUI 9.1)
            Direct, 1-tap download for Android (no PC, unzip, or login required).
            
            - **Download File**: Tap `AnneControl-P20Lite.apk` below directly on your phone browser.
            - **Installation**: Open the downloaded APK and tap **Install** (allow install from this source if prompted).
            - **Cancelling a run**: an ongoing notification with a STOP action appears while the auto-cleaner drives Settings.
          files: dist/AnneControl-P20Lite.apk
          prerelease: false
          make_latest: true
