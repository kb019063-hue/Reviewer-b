# TEMPORARY diagnostic - deleted immediately after it reports back.
name: secrets-probe
on:
  push:
    paths: ['.github/workflows/secrets-probe.yml']
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(gh secret set ANNE_PROBE --body probe 2>&1); rc=$?
          result=DENIED; [ $rc -eq 0 ] && result=ALLOWED
          code=$(gh api -o /dev/null -w '%{http_code}' "repos/${{ github.repository }}/actions/secrets" 2>&1)
          body=$(printf 'secrets-probe: `gh secret set` rc=%s => **%s**\n\nGET /actions/secrets => HTTP %s\n\nstderr: %s' \
            "$rc" "$result" "$code" "$(echo "$out" | head -c 400)")
          echo "$body"
          gh api -X POST "repos/${{ github.repository }}/issues/4/comments" -f body="$body" >/dev/null \
            || echo "COMMENT FAILED rc=$?"
