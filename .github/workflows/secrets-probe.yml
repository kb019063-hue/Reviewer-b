# TEMPORARY diagnostic - deleted immediately after it reports back.
name: secrets-probe
on:
  push:
    paths: ['.github/workflows/secrets-probe.yml']
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          R="${{ github.repository }}"
          out=$(gh secret set ANNE_PROBE --repo "$R" --body probe 2>&1); rc=$?
          result=DENIED; [ $rc -eq 0 ] && result=ALLOWED
          echo "rc=$rc result=$result out=$out"
          get=$(gh api "repos/$R/actions/secrets" -q '.secrets | length' 2>&1); grc=$?
          body=$(printf 'secrets-probe: `gh secret set --repo` rc=%s => **%s**\n\nGET /actions/secrets rc=%s, count=%s\n\noutput: %s' \
            "$rc" "$result" "$grc" "$get" "$(echo "$out" | head -c 400)")
          gh api -X POST "repos/$R/issues/4/comments" -f body="$body" >/dev/null || echo "COMMENT FAILED"
