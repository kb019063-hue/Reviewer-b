name: Build AnneControl Huawei P20 Lite APK

on:
  push:
    branches:
      - "arena/**"
      - "main"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Choose a disposable test APK or a stable signed release"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run UI and JVM tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: UI regression tests
        working-directory: test/ui
        run: |
          npm ci --no-fund --no-audit
          npm test

      - name: Queue planner JVM tests
        run: |
          mkdir -p /tmp/annecontrol-unit-tests
          javac -encoding UTF-8 -Xlint:all,-options \
            -d /tmp/annecontrol-unit-tests \
            anne-control-apk/src/main/java/com/annecontrol/p20lite/HuaweiCatalog.java \
            anne-control-apk/src/main/java/com/annecontrol/p20lite/QueuePlanner.java \
            anne-control-apk/test/java/com/annecontrol/p20lite/QueuePlannerTest.java
          java -cp /tmp/annecontrol-unit-tests com.annecontrol.p20lite.QueuePlannerTest

  # No secrets: an ephemeral signer creates a disposable test APK on main pushes.
  # It is never published as a release and a later build cannot update it in place.
  build-debug-apk:
    name: Build test-only debug APK (ephemeral signer)
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.build_mode == 'debug')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android 9 (API 28) Platform SDK if needed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-28/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" || true
          fi

      - name: Build, align, and sign disposable test APK
        run: python3 anne-control-apk/ci_build.py --debug-test

      - name: Upload test-only APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnneControl-P20Lite-Debug-TEST-ONLY
          path: dist/AnneControl-P20Lite-Debug.apk
          if-no-files-found: error
          retention-days: 30

  # Release signing material is used only on an explicit main-branch release dispatch.
  build-apk:
    name: Build & Sign AnneControl release APK
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android 9 (API 28) Platform SDK if needed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-28/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" || true
          fi

      - name: Build, align, sign, and verify release APK
        env:
          ANNE_SIGNING_KEY: ${{ secrets.ANNE_SIGNING_KEY }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ANNE_SIGNER_SHA256: ${{ vars.ANNE_SIGNER_SHA256 }}
        run: python3 anne-control-apk/ci_build.py

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnneControl-P20Lite-APK
          path: dist/AnneControl-P20Lite.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish signed APK release
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AnneControl-P20Lite-APK
          path: dist

      # Only this explicit main-only release job receives a write token.
      - name: Publish Direct-Download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "AnneControl P20 Lite (Latest APK Direct Download)"
          body: |
            ### AnneControl for Huawei P20 Lite (ANE-LX1 / EMUI 9.1)
            Direct APK download.

            - Install the APK on the phone and allow installs from this source if prompted.
            - Settings automation is supported only on ANE-LX1 / Android 9 (EMUI 9.1).
          files: dist/AnneControl-P20Lite.apk
          prerelease: false
          make_latest: true
