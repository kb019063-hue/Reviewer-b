name: Build AnneControl Huawei P20 Lite APK

on:
  push:
    branches:
      - "arena/**"
      - "main"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign AnneControl APK (Android 9 / ANE-LX1)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android 9 (API 28) Platform SDK if needed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-28/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" || true
          fi

      - name: Compile, Align & Sign AnneControl-P20Lite.apk
        run: python3 anne-control-apk/ci_build.py

      - name: Upload AnneControl APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnneControl-P20Lite-APK
          path: dist/AnneControl-P20Lite.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Direct-Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        with:
          tag_name: latest-apk
          name: "AnneControl P20 Lite (Latest APK Direct Download)"
          body: |
            ### 📱 AnneControl for Huawei P20 Lite (ANE-LX1 / EMUI 9.1)
            Direct, 1-tap download for Android (no PC, unzip, or login required).
            
            - **Download File**: Tap `AnneControl-P20Lite.apk` below directly on your phone browser.
            - **Installation**: Open the downloaded APK and tap **Install** (allow install from this source if prompted).
          files: dist/AnneControl-P20Lite.apk
          prerelease: false
          make_latest: true
