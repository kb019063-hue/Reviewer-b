# TEMPORARY diagnostic - deleted immediately after it reports back.
# Question: can a workflow's own GITHUB_TOKEN write a repository secret?
name: secrets-probe
on:
  push:
    paths: ['.github/workflows/secrets-probe.yml']
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=DENIED
          if gh secret set ANNE_PROBE --body "probe" 2>/tmp/err; then result=ALLOWED; fi
          echo "probe result: $result"
          gh pr comment 4 --body "secrets-probe: GITHUB_TOKEN \`gh secret set\` => **$result**" || true
          cat /tmp/err || true
